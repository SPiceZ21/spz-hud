<!DOCTYPE html>
<!-- spz-pausemenu — the pause menu page (client/pausemenu.lua).
     Main menu → options of the selected section → that option's settings,
     over the blurred game, in the TAB hub's components (see style.css).
     Game settings hand off to GTA's own settings screen (scripts cannot
     change GTA graphics); UI settings are ours and apply at once.
     The previous bento page is backed up in spz-pausemenu-backup/page. -->
<html lang="en">
<head>

</div>
